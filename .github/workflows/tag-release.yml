name: Tag Release

on:
  push:
    branches:
      - staging

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_latest_tag
        run: |
          latest_tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          echo "Latest tag: $latest_tag"
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Parse version
        id: parse_version
        run: |
          tag=${{ steps.get_latest_tag.outputs.tag }}
          if [[ -z "$tag" ]]; then
            tag="v0.0.0"
          fi

          version="${tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT

      - name: Get last commit message
        id: get_commit
        run: |
          msg=$(git log -1 --pretty=%B)
          echo "Last commit message: $msg"
          echo "message=$msg" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: bump
        run: |
          major=${{ steps.parse_version.outputs.major }}
          minor=${{ steps.parse_version.outputs.minor }}
          patch=${{ steps.parse_version.outputs.patch }}
          msg="${{ steps.get_commit.outputs.message }}"

          if [[ "$msg" == *"major-bump"* ]]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [[ "$msg" == *"minor-bump"* ]]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_tag="v$major.$minor.$patch"
          echo "New tag: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Create new tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}